services:
  postgres:
    image: postgres:16-alpine
    container_name: lux-exchange-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lux_exchange_dev
      POSTGRES_DB: lux_exchange

    ports:
      - "5435:5432"

    volumes:
      - lux_exchange_postgres_data:/var/lib/postgresql/data

volumes:
  lux_exchange_postgres_data:
  